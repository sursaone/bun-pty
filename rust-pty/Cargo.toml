[package]
name = "rust-pty"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true # Automatically strip symbols from the binary
opt-level = 3
lto = "fat"
codegen-units = 1


[lib]
crate-type = ["cdylib"]

[dependencies]
# Held at 0.8.1: 0.9.0 returns garbage from reads on Windows, still open in
# https://github.com/wezterm/wezterm/issues/6783
portable-pty = { version = "0.8.1", features = ["serde_support"] }
lazy_static = "1.5"
crossbeam = { version = "0.8.5", features = ["crossbeam-channel"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.1"
